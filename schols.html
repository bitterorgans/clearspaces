<div class="bookshelf-container">
  <button class="scroll-btn left">‹</button>
  <!-- Thin container below bookshelf -->

  <div class="bookshelf-track" id="bookshelfTrack">
    <div class="book add-book" id="addBook">
      <div class="plus">＋</div>
    </div>
  </div>

  <button class="scroll-btn right">›</button>

  <input type="file" id="bookUpload" accept="image/*" hidden>
</div>
  


  
  
  
  
<script>
const track = document.getElementById('bookshelfTrack');
const addBook = document.getElementById('addBook');
const uploadInput = document.getElementById('bookUpload');

const storageKey = 'bookshelf-data';
let books = JSON.parse(localStorage.getItem(storageKey) || '[]');

function saveBooks() {
  localStorage.setItem(storageKey, JSON.stringify(books));
}

function renderBooks() {
  // Remove all existing book elements except add-book
  track.querySelectorAll('.book:not(.add-book)').forEach(el => el.remove());

  books.forEach((book, index) => {
    const bookEl = document.createElement('div');
    bookEl.className = 'book';

    bookEl.innerHTML = `
      <img src="${book.image}">
      <input type="checkbox" ${book.finished ? 'checked' : ''}>
      <button class="delete-book">X</button>
    `;

    const checkbox = bookEl.querySelector('input');
    const deleteBtn = bookEl.querySelector('.delete-book');

    // Fade finished books
    bookEl.style.opacity = book.finished ? '0.6' : '1';

    checkbox.addEventListener('change', () => {
      books[index].finished = checkbox.checked;
      bookEl.style.opacity = checkbox.checked ? '0.6' : '1';
      saveBooks();
      updateFocus();
    });

    deleteBtn.addEventListener('click', () => {
      books.splice(index, 1);
      saveBooks();
      renderBooks();
      updateFocus();
    });

    track.insertBefore(bookEl, addBook);
  });

  updateFocus();
}

// Add book
addBook.addEventListener('click', () => uploadInput.click());

uploadInput.addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    books.push({ image: e.target.result, finished: false });
    saveBooks();
    renderBooks();
  };
  reader.readAsDataURL(file);
});

// Scroll buttons
document.querySelector('.scroll-btn.left').addEventListener('click', () => {
  const focused = track.querySelector('.book.focused');
  const booksEls = Array.from(track.querySelectorAll('.book:not(.add-book)'));
  let index = focused ? booksEls.indexOf(focused) : 0;
  const prevIndex = Math.max(index - 1, 0);
  scrollToBook(booksEls[prevIndex]);
});

document.querySelector('.scroll-btn.right').addEventListener('click', () => {
  const focused = track.querySelector('.book.focused');
  const booksEls = Array.from(track.querySelectorAll('.book:not(.add-book)'));
  let index = focused ? booksEls.indexOf(focused) : 0;
  const nextIndex = Math.min(index + 1, booksEls.length - 1);
  scrollToBook(booksEls[nextIndex]);
});

function scrollToBook(bookEl) {
  const trackRect = track.getBoundingClientRect();
  const bookRect = bookEl.getBoundingClientRect();
  const offset = (bookRect.left + bookRect.width / 2) - (trackRect.left + trackRect.width / 2);
  track.scrollBy({ left: offset, behavior: 'smooth' });
  setTimeout(updateFocus, 250);
}

// Focus effect
function updateFocus() {
  const booksEls = track.querySelectorAll('.book:not(.add-book)');
  const trackRect = track.getBoundingClientRect();
  const trackCenter = trackRect.left + trackRect.width / 2;

  let closest = null;
  let closestDistance = Infinity;

  booksEls.forEach(book => {
    const rect = book.getBoundingClientRect();
    const bookCenter = rect.left + rect.width / 2;
    const distance = Math.abs(trackCenter - bookCenter);
    if (distance < closestDistance) {
      closestDistance = distance;
      closest = book;
    }
  });

  booksEls.forEach(book => book.classList.remove('focused'));
  if (closest) closest.classList.add('focused');
}

// Initial render
renderBooks();

</script>


  
  
  <script>
document.querySelectorAll('.fourth-box').forEach(box => {

  const key = box.dataset.key;
  const itemList = box.querySelector('.items-list');
  const addBtn = box.querySelector('.add-item');

  const storageKey = key + '-items';
  const savedItems = JSON.parse(localStorage.getItem(storageKey) || '[]');

  savedItems.forEach(data => createItem(data));

  addBtn.addEventListener('click', () => {
    createItem();
    saveItems();
  });

  function createItem(data = {}) {

    const item = document.createElement('div');
    item.className = 'fourth-item';

    item.innerHTML = `
      <div class="item-row">
        <span class="bullet"></span>
        <input type="text" placeholder="Task title" value="${data.title || ''}">
        <select class="importance-pill">
          <option value="low">LOW</option>
          <option value="med">MED</option>
          <option value="high">HIGH</option>
        </select>
        <button class="delete-item">×</button>
      </div>
      <textarea placeholder="Description...">${data.desc || ''}</textarea>
    `;

    const input = item.querySelector('input');
    const textarea = item.querySelector('textarea');
    const select = item.querySelector('.importance-pill');
    const deleteBtn = item.querySelector('.delete-item');

    select.value = data.importance || 'low';
    updateImportanceColor();

    function updateImportanceColor() {
      select.classList.remove('low','med','high');
      select.classList.add(select.value);
    }

    function autoResize() {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
      saveItems();
    }

    input.addEventListener('input', saveItems);
    textarea.addEventListener('input', autoResize);
    select.addEventListener('change', () => {
      updateImportanceColor();
      saveItems();
    });

    deleteBtn.addEventListener('click', () => {
      item.remove();
      saveItems();
    });

    itemList.appendChild(item);
    autoResize();
  }

  function saveItems() {
    const data = [];
    itemList.querySelectorAll('.fourth-item').forEach(item => {
      data.push({
        title: item.querySelector('input').value,
        desc: item.querySelector('textarea').value,
        importance: item.querySelector('.importance-pill').value
      });
    });
    localStorage.setItem(storageKey, JSON.stringify(data));
  }

});

</script>
