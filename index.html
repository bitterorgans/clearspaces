<script>
const text = "welcome . . . !";
let i = 0;

function typeWelcome() {
  if (i < text.length) {
    document.getElementById("welcome").textContent += text.charAt(i);
    i++;
    setTimeout(typeWelcome, 80);
  }
}

window.addEventListener("load", typeWelcome);
</script>
