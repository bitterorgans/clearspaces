<script>
  // Tab navigation mapping
  const tabNavigation = {
    'tab1': 'standards.html',
    'tab2': 'gened.html',
    'tab3': 'schols.html'
  };

  // Add click event to each tab container
  Object.keys(tabNavigation).forEach(tabClass => {
    const tabElement = document.querySelector(`.tab-hitbox.${tabClass}`);
    if (tabElement) {
      tabElement.addEventListener('click', () => {
        window.location.href = tabNavigation[tabClass];
      });
    }
  });
</script>
